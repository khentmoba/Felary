name: Deploy site

on:
  push:
    branches:
      - main
  # Check the app repositories for new releases every three hours.
  schedule:
    - cron: '17 */3 * * *'
  # An app repository can trigger this right after publishing a release.
  repository_dispatch:
    types: [app-released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site with the latest releases
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FELARY_RELEASES: strict

      - name: Skip if no app has a new release
        id: changes
        if: github.event_name == 'schedule'
        run: |
          if curl -fsS --connect-timeout 10 --max-time 30 https://felary.pages.dev/releases.json -o live-releases.json && cmp -s live-releases.json dist/releases.json; then
            echo "No new releases since the last deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.changes.outputs.deploy != 'false'
        run: npx wrangler pages deploy dist --project-name felary --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
